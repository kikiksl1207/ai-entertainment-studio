<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>승인자료 확인 | Lumina Stage</title>
    <link rel="icon" href="/assets/brand/lumina-stage-logo.png" />
    <link rel="stylesheet" href="/pages/creator-approved-section-bytes.css?v=approved-section-bytes-20261013-v1" />
    <link rel="stylesheet" href="/pages/creator-approved-reading-entry.css?v=20261015-visible-works-v1" />
    <script defer src="/pages/creator-approved-readonly-transport.js?v=20261019-auth-time-v1"></script>
    <script defer src="/pages/creator-approved-reading-handoff.js?v=20261013-v1"></script>
    <script defer src="/pages/creator-approved-reading-catalog.js?v=20261015-auth-reason-v1"></script>
    <script defer src="/pages/creator-approved-reading-entry.js?v=20261019-auth-time-v1"></script>
    <script defer src="/pages/creator-approved-section-bytes.js?v=approved-section-bytes-20261013-v1"></script>
    <script defer src="/pages/creator-body-preview.js?v=author-body-preview-20261002-v1"></script>
    <script defer src="/pages/creator-approved-reading-body.js?v=20261013-body-v1"></script>
  </head>
  <body>
    <header class="reading-top">
      <a class="reading-brand" href="/"><img src="/assets/brand/lumina-stage-logo.png" alt="" />Lumina Stage</a>
      <a id="readingStudioLink" href="/creator-studio/">스튜디오</a>
    </header>
    <main id="studioShell">
      <section id="writer-manuscript" class="is-active">
        <div class="reading-heading">
          <div><h1 id="readingTitle">승인자료 확인</h1><p id="readingWorkTitle">작품 연결 없음</p></div>
          <label class="reading-language"><span id="readingLocaleLabel">언어</span><select id="readingLocale"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select></label>
        </div>
        <p id="readingConnectionState" role="status" aria-live="polite"></p>
        <section id="readingCatalog" class="reading-catalog" aria-labelledby="readingCatalogTitle" hidden>
          <h2 id="readingCatalogTitle">내 작품</h2>
          <div class="reading-catalog-controls">
            <label><span id="readingCatalogWorkLabel">작품 선택</span><select id="readingCatalogWork" disabled><option value="">작품 선택</option></select></label>
            <button id="readingCatalogLoad" type="button">작품 불러오기</button>
            <button id="readingCatalogNext" type="button" title="다음 작품" aria-label="다음 작품" disabled>&#8594;</button>
          </div>
          <ul id="readingCatalogWorks" class="reading-catalog-works" aria-labelledby="readingCatalogTitle" hidden></ul>
          <p id="readingCatalogState" role="status" aria-live="polite"></p>
          <a id="readingCatalogLogin" href="/#login" target="_blank" rel="noopener noreferrer" hidden>로그인 (새 탭)</a>
        </section>
        <input id="writerManuscriptWork" type="hidden" value="" />
        <input id="writerManuscriptLocale" type="hidden" value="ko" />
        <section id="readingSavedBody" aria-labelledby="readingSavedBodyTitle"></section>
        <section id="writerApprovedSectionBytes" aria-labelledby="writerApprovedSectionBytesTitle"></section>
      </section>
    </main>
  </body>
</html>
